name: siem-platform

services:

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soc_platform}
      POSTGRES_USER: ${POSTGRES_USER:-soc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc} -d ${POSTGRES_DB:-soc_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siem-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siem-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - siem-net

  9router:
    image: decolua/9router:latest
    restart: unless-stopped
    environment:
      PORT: "20128"
      JWT_SECRET: ${NINEROUTER_JWT_SECRET:-change-me-ninerouter-jwt-secret}
      INITIAL_PASSWORD: ${NINEROUTER_INITIAL_PASSWORD:-change-me-ninerouter-password}
      API_KEY_SECRET: ${NINEROUTER_API_KEY_SECRET:-change-me-ninerouter-secret}
      REQUIRE_API_KEY: "false"
    volumes:
      - ninerouter_data:/app/data
    ports:
      - "20129:20128"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:20128/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - siem-net

  package-builder:
    build:
      context: ./agent
      dockerfile: Dockerfile.packages
    volumes:
      - agent_packages:/output
    restart: "no"
    networks:
      - siem-net

  server-api:
    build:
      context: ./server-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://soc:soc@postgres:5432/soc_platform}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      AGENT_ENROLLMENT_TOKEN: ${AGENT_ENROLLMENT_TOKEN:-bootstrap-token}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_STREAM_KEY: ${REDIS_STREAM_KEY:-siem:logs}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
    volumes:
      - agent_packages:/app/packages:ro
    depends_on:
      package-builder:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/health').raise_for_status()\""]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - siem-net

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-searxng-secret}
    volumes:
      - ./searxng:/etc/searxng
    networks:
      - siem-net

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://soc:soc@postgres:5432/soc_platform}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_STREAM_KEY: ${REDIS_STREAM_KEY:-siem:logs}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-siem-workers}
      DECODERS_DIR: /app/decoders
      RULES_DIR: /app/rules
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-http://9router:20128/v1}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      NINEROUTER_MODEL: ${NINEROUTER_MODEL:-combo}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      RELOAD_INTERVAL: ${RELOAD_INTERVAL:-60}
      WEBHOOK_RETRY_INTERVAL: ${WEBHOOK_RETRY_INTERVAL:-30}
      MAX_WEBHOOK_ATTEMPTS: ${MAX_WEBHOOK_ATTEMPTS:-5}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
    volumes:
      - ./decoders:/app/decoders:ro
      - ./rules:/app/rules:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      9router:
        condition: service_healthy
      server-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - siem-net

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - server-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - siem-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server-api
      - dashboard
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - siem-net

  agent-demo:
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AGENT_ENROLLMENT_TOKEN: ${AGENT_ENROLLMENT_TOKEN:-bootstrap-token}
    volumes:
      - /var/log:/host/var/log:ro
    depends_on:
      server-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f siem-agent || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - siem-net

volumes:
  postgres_data:
  redis_data:
  es_data:
  ninerouter_data:
  agent_packages:

networks:
  siem-net:
    driver: bridge
