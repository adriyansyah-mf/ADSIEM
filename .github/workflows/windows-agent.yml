name: Windows agent

# Builds the MSI and installs it on a real Windows runner: service, enrollment
# (against tests/windows/mock_siem.py), event log shipping, uninstall.
on:
  pull_request:
    paths:
      - "agent/**"
      - "tests/windows/**"
      - "dashboard/src/lib/deployCommands.ts"
      - ".github/workflows/windows-agent.yml"
  workflow_dispatch:
    inputs:
      soak_duration:
        description: "Also run the sustained evidence capture on Linux and Windows for this long (e.g. 1h); empty skips it"
        default: ""
      soak_rate:
        description: "Sustained capture events per second"
        default: "200"

permissions:
  contents: read

jobs:
  # Durable evidence on real Windows: journal, file cursors, Event Log
  # bookmarks against a disposable test log (tests/windows/evidence-resume.ps1).
  native-evidence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: agent/go.sum

      - name: Native evidence, cursor and bookmark tests
        shell: pwsh
        run: ./tests/windows/evidence-resume.ps1

      # VirtualQueryEx / ReadProcessMemory on a real Windows process: YARA
      # finds a marker in the test's own memory, a PAGE_EXECUTE_READWRITE
      # allocation is reported, the memyara plugin and memory_scan task run.
      - name: Process memory scan
        shell: pwsh
        run: go test ./agent/internal/memscan ./agent/internal/task -run 'Mem|Scan|Suspicious|Sweep|Limits|Region' -count=1 -v

      # Hosts file, machine ROOT store and block page on a real (elevated)
      # runner: HTTP and HTTPS both get the 403 page, removal leaves nothing.
      - name: Web protection unit and end-to-end
        shell: pwsh
        run: |
          go test ./agent/internal/webblock/... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WEBBLOCK_E2E = '1'
          go test ./agent/internal/webblock -run E2E -count=1 -v

      # IP IoC blocklist in WFP filters (fwpuclnt.dll, dynamic session) on a
      # real elevated runner: a listed address is unreachable, dropping it
      # from the list (or closing the session) restores it; the struct layouts,
      # the netsh fallback and the ipblock sync/watcher run natively too.
      - name: WFP IoC blocking
        shell: pwsh
        run: go test ./agent/internal/firewall ./agent/internal/ipblock -count=1 -v -run 'WFP|IOC|Watcher|Sync|Routine'

      # Quarantine stops the processes running the file (a copy of ping.exe),
      # leaving the real one alone.
      - name: Quarantine stops running processes
        shell: pwsh
        run: go test ./agent/internal/task -run TestStopRunning -count=1 -v

      # IT hygiene on a real Windows host: posture from the registry, listening
      # ports with their address and process, network identity and sessions.
      - name: IT hygiene collector
        shell: pwsh
        run: go test ./agent/internal/hygiene -count=1 -v

      # App Control (WDAC) on the disposable runner: the agent's policy, built
      # from AllowAll plus a path deny rule and activated in enforce mode,
      # stops a copied whoami.exe before it runs; the policy is removed after.
      - name: App Control (WDAC) end-to-end
        shell: pwsh
        run: |
          go test ./agent/internal/appcontrol -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:APPCONTROL_E2E = '1'
          go test ./agent/internal/appcontrol -run TestAppControlEnforcesAPathRule -count=1 -v

  msi-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke-test dependencies
        run: pip install cryptography

      - name: Build MSI
        working-directory: agent
        shell: pwsh
        run: ./packaging/build-msi.ps1 -Version 0.0.1

      - name: Install, enroll, ship an event, uninstall
        shell: pwsh
        run: ./tests/windows/smoke-msi.ps1 -Msi agent/dist/packages/siem-agent-0.0.1-x64.msi

  # The same MSI in durable evidence mode, on a fresh runner (no prior install).
  msi-smoke-durable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke-test dependencies
        run: pip install cryptography

      - name: Build MSI
        working-directory: agent
        shell: pwsh
        run: ./packaging/build-msi.ps1 -Version 0.0.1

      - name: Install, enroll, ship an event durably, uninstall
        shell: pwsh
        run: ./tests/windows/smoke-msi.ps1 -Msi agent/dist/packages/siem-agent-0.0.1-x64.msi -Durable

      - name: Keep the MSI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siem-agent-msi
          path: agent/dist/packages/*.msi

  # Self-update through the installed service: two MSIs trusting a throwaway
  # update key, upgraded and rolled back by the agent (tests/windows/update-msi.ps1).
  msi-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build two signed MSIs, upgrade and roll back through the service
        shell: pwsh
        run: |
          Push-Location agent
          go build -o siem-update-sign.exe ./cmd/siem-update-sign
          if ($LASTEXITCODE -ne 0) { throw "building siem-update-sign failed" }
          $keygen = ./siem-update-sign.exe keygen -out "$env:RUNNER_TEMP\update.key"
          $env:UPDATE_KEYS = $keygen[-1]
          ./packaging/build-msi.ps1 -Version 9.0.0
          ./packaging/build-msi.ps1 -Version 9.0.1
          ./siem-update-sign.exe sign -key "$env:RUNNER_TEMP\update.key" dist/packages/siem-agent-9.0.0-x64.msi dist/packages/siem-agent-9.0.1-x64.msi
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          ./siem-update-sign.exe verify -pub $env:UPDATE_KEYS dist/packages/siem-agent-9.0.0-x64.msi dist/packages/siem-agent-9.0.1-x64.msi
          if ($LASTEXITCODE -ne 0) { throw "verify failed" }
          Pop-Location
          ./tests/windows/update-msi.ps1 -Old agent/dist/packages/siem-agent-9.0.0-x64.msi `
            -New agent/dist/packages/siem-agent-9.0.1-x64.msi -Signer agent/siem-update-sign.exe

      # upload-artifact needs one root: C:\ProgramData and the work dir are on different drives
      - name: Collect the agent's update files
        if: failure()
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\msi-update-diagnostics"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item -Recurse -ErrorAction SilentlyContinue C:\ProgramData\SIEMAgent\update, C:\ProgramData\SIEMAgent\agent.log $d
          Copy-Item -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\siem-update\*.log", "$env:RUNNER_TEMP\siem-update\mock\heartbeats.jsonl" $d

      - name: Keep the agent's update files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-update-diagnostics
          path: ${{ runner.temp }}/msi-update-diagnostics
          if-no-files-found: warn

  # Durable journal capture on each native OS (agent/internal/evidence/soak_test.go),
  # only when dispatched with soak_duration: it takes that long.
  soak:
    name: Sustained capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: inputs.soak_duration != ''
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: agent/go.sum

      - name: Capture
        shell: bash
        env:
          EVIDENCE_SOAK: ${{ inputs.soak_duration }}
          EVIDENCE_SOAK_RATE: ${{ inputs.soak_rate }}
          EVIDENCE_SOAK_DIR: ${{ runner.temp }}
          EVIDENCE_SOAK_REPORT: ${{ runner.temp }}/soak-${{ matrix.os }}.json
        run: go test ./agent/internal/evidence -run TestSustainedCapture -count=1 -timeout 0 -v

      - name: Record the runner
        if: always()
        shell: bash
        run: |
          {
            echo "os=${{ matrix.os }}"
            if [ "$RUNNER_OS" = "Windows" ]; then
              powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Select -Expand Name; Get-Volume | Format-Table -AutoSize | Out-String"
            else
              lscpu | grep 'Model name'; df -T "$RUNNER_TEMP"
            fi
          } > "$RUNNER_TEMP/runner-${{ matrix.os }}.txt" 2>&1

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-soak-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/soak-${{ matrix.os }}.json
            ${{ runner.temp }}/runner-${{ matrix.os }}.txt
          if-no-files-found: warn
