name: Evidence sustained capture

# One-hour durable journal capture on each native OS
# (agent/internal/evidence/soak_test.go). Manual only: it takes an hour.
# Reports go to docs/operations/agent-evidence-validation.md.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Capture length (Go duration)"
        default: "1h"
      rate:
        description: "Events per second"
        default: "200"

permissions:
  contents: read

jobs:
  capture:
    name: Sustained capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: agent/go.sum

      - name: Capture
        shell: bash
        env:
          EVIDENCE_SOAK: ${{ inputs.duration }}
          EVIDENCE_SOAK_RATE: ${{ inputs.rate }}
          EVIDENCE_SOAK_DIR: ${{ runner.temp }}
          EVIDENCE_SOAK_REPORT: ${{ runner.temp }}/soak-${{ matrix.os }}.json
        run: go test ./agent/internal/evidence -run TestSustainedCapture -count=1 -timeout 0 -v

      - name: Record the runner
        if: always()
        shell: bash
        run: |
          {
            echo "os=${{ matrix.os }}"
            if [ "$RUNNER_OS" = "Windows" ]; then
              powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Select -Expand Name; Get-Volume | Format-Table -AutoSize | Out-String"
            else
              lscpu | grep 'Model name'; df -T "$RUNNER_TEMP"
            fi
          } > "$RUNNER_TEMP/runner-${{ matrix.os }}.txt" 2>&1

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-soak-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/soak-${{ matrix.os }}.json
            ${{ runner.temp }}/runner-${{ matrix.os }}.txt
          if-no-files-found: warn
