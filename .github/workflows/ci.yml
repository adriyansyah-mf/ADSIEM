name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    services:
      # for the *.int.py tests that need a real database (agent enrollment)
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U soc" --health-interval 5s --health-timeout 5s --health-retries 10
      # for the tests that need a real stream (stream maintenance, evidence dispatch)
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install server-api dependencies
        run: pip install -r server-api/requirements.txt

      - name: Install worker dependencies
        run: pip install -r worker/requirements.txt

      - name: Run pytest
        env:
          # Throwaway test value (not a secret): Settings() requires JWT_SECRET
          # at import time, with a strong-value validator.
          JWT_SECRET: "ci-test-secret-0123456789abcdef0123456789abcdef"
          TEST_DATABASE_URL: "postgresql+asyncpg://soc:soc@localhost:5432/test"
          TEST_REDIS_URL: "redis://localhost:6379/0"
          # the investigator test drives the app's own engine, bound from DATABASE_URL
          DATABASE_URL: "postgresql+asyncpg://soc:soc@localhost:5432/test"
        run: |
          # Separate processes mirror the deployed services: each owns its
          # Prometheus registry and registers the same siem_llm_* metric names.
          # Collecting both gateways in one interpreter causes duplicate metrics.
          pytest tests/server-api
          pytest tests/evidence  # acceptance assertions; the Docker harness runs in evidence-acceptance
          pytest tests/worker worker/tests \
            --ignore=tests/worker/test_pipeline.int.test.py \
            --deselect worker/tests/test_rag.py::test_embed_text_returns_384_dimensions \
            --deselect worker/tests/test_rag.py::test_embed_text_different_inputs_differ

  go-tests:
    name: Go agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: agent/go.sum

      # procexec and netwatch go:embed eBPF objects: build them so every
      # package (cmd/agent included) is compiled and tested.
      - name: Build eBPF objects
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm
          make -C agent bpf

      - name: go test (all agent packages)
        run: go test -race ./agent/... ./tests/agent/...

      # Loads the real linsensor object into the runner's kernel (verifier,
      # CO-RE, tracepoints) and checks file, memfd/fileless, ptrace,
      # privilege and exit events end to end.
      - name: linsensor end-to-end (eBPF, root)
        working-directory: agent
        run: sudo -E env "PATH=$PATH" LINSENSOR_E2E=1 go test -count=1 -run TestSensorEndToEnd -v ./internal/linsensor/

      # Execution prevention against the runner's kernel: the fanotify
      # engine always; the BPF LSM engine when the kernel has "bpf" in its
      # LSM list (the test skips that half otherwise).
      - name: exec prevention end-to-end (root)
        working-directory: agent
        run: sudo -E env "PATH=$PATH" PREVENT_E2E=1 go test -count=1 -run 'TestPrevent' -v ./internal/prevent/

      # A child process encrypts-and-renames files and writes a canary; the
      # guard must kill it both times.
      - name: anti-ransomware end-to-end (eBPF, root)
        working-directory: agent
        run: sudo -E env "PATH=$PATH" RANSOM_E2E=1 go test -count=1 -run TestRansomwareEndToEnd -v ./internal/ransomguard/

      - name: Windows vet + build
        working-directory: agent
        env:
          GOOS: windows
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go build -o /dev/null ./cmd/agent/

  # End-to-end durable evidence under faults (tests/evidence/run.py): a
  # disposable Compose project per scenario with PostgreSQL, Redis,
  # Elasticsearch, server-api, worker, a fault proxy and the Linux agent.
  evidence-acceptance:
    name: Evidence acceptance (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [offline-restart, lost-response, redis-loss, worker-crash, quota, corruption, retention]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scenario
        run: |
          python tests/evidence/run.py --build --scenario "${{ matrix.scenario }}" \
            --count 10000 --output "evidence-artifacts/${{ matrix.scenario }}"

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.scenario }}
          path: evidence-artifacts/${{ matrix.scenario }}
          retention-days: 14
          if-no-files-found: warn

  dashboard-build:
    name: Dashboard build (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
