name: Agent Release

on:
  push:
    tags:
      - "agent-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: agent/go.sum

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Clean stale build output
        run: rm -rf dist

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash packaging/build-deb.sh

      # rpmbuild doesn't reliably cross-package a foreign-arch binary on an
      # x86_64 runner without a mock/QEMU chroot, so .rpm is only produced
      # for the runner's native arch. arm64 still gets a .deb and raw binary.
      - name: Build .rpm
        if: matrix.arch == 'amd64'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: x86_64
        run: bash packaging/build-rpm.sh

      - name: Build raw binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "dist/packages/siem-agent-linux-${{ matrix.arch }}" \
            ./cmd/agent/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: agent/dist/packages/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=agent-v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "siem-agent v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: dist/*
