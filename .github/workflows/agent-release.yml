name: Agent Release

on:
  push:
    tags:
      - "agent-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.1.0)"
        required: true

permissions:
  contents: write

# Self-update trust (agent/internal/update): agents built here trust these
# base64 ed25519 public keys (repository variable), and the release job signs
# every deb/rpm/msi with the matching private key (repository secret
# AGENT_UPDATE_SIGNING_KEY, made with `siem-update-sign keygen`).
env:
  UPDATE_KEYS: ${{ vars.AGENT_UPDATE_PUBLIC_KEYS }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm clang

      - name: Clean stale build output
        run: rm -rf dist

      - name: Build eBPF object (process-exec monitor)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            amd64) BPF_ARCH=x86 ;;
            arm64) BPF_ARCH=arm64 ;;
            *)     BPF_ARCH=x86 ;;
          esac
          clang -O2 -g -target bpf -D__TARGET_ARCH_${BPF_ARCH} \
            -I internal/procexec/bpf/include \
            -c internal/procexec/bpf/execve.bpf.c \
            -o internal/procexec/bpf/execve.bpf.o
          clang -O2 -g -target bpf -D__TARGET_ARCH_${BPF_ARCH} \
            -I internal \
            -c internal/netwatch/bpf/netwatch.bpf.c \
            -o internal/netwatch/bpf/netwatch.bpf.o

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash packaging/build-deb.sh

      # rpmbuild doesn't reliably cross-package a foreign-arch binary on an
      # x86_64 runner without a mock/QEMU chroot, so .rpm is only produced
      # for the runner's native arch. arm64 still gets a .deb and raw binary.
      - name: Build .rpm
        if: matrix.arch == 'amd64'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: x86_64
        run: bash packaging/build-rpm.sh

      - name: Build raw binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.UpdateKeys=${UPDATE_KEYS}" \
            -o "dist/packages/siem-agent-linux-${{ matrix.arch }}" \
            ./cmd/agent/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: agent/dist/packages/*

  build-windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows zip (exe + install scripts)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: amd64
        run: bash packaging/build-windows.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows-amd64
          path: agent/dist/packages/*

  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke-test dependencies
        run: pip install cryptography

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MSI
        working-directory: agent
        shell: pwsh
        run: ./packaging/build-msi.ps1 -Version ${{ steps.version.outputs.version }}

      # the release MSI must install, enroll and ship events before it's published
      - name: Smoke test
        shell: pwsh
        run: ./tests/windows/smoke-msi.ps1 -Msi agent/dist/packages/siem-agent-${{ steps.version.outputs.version }}-x64.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows-msi
          path: agent/dist/packages/*.msi

  release:
    needs: [build, build-windows, build-msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=agent-v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum

      # A .sig per package: without one, agents never install it as an update.
      - name: Sign packages for self-update
        env:
          SIEM_UPDATE_SIGNING_KEY: ${{ secrets.AGENT_UPDATE_SIGNING_KEY }}
        run: |
          shopt -s nullglob
          pkgs=(dist/*.deb dist/*.rpm dist/*.msi)
          if [ -z "$SIEM_UPDATE_SIGNING_KEY" ]; then
            if [ -n "$UPDATE_KEYS" ]; then
              echo "::error::AGENT_UPDATE_PUBLIC_KEYS is set but AGENT_UPDATE_SIGNING_KEY is not: agents would trust a key no package is signed with"
              exit 1
            fi
            echo "::warning::AGENT_UPDATE_SIGNING_KEY not set: packages are unsigned and cannot be rolled out as updates"
            exit 0
          fi
          (cd agent && go build -o ../siem-update-sign ./cmd/siem-update-sign)
          ./siem-update-sign sign "${pkgs[@]}"
          if [ -n "$UPDATE_KEYS" ]; then
            ./siem-update-sign verify -pub "$UPDATE_KEYS" "${pkgs[@]}"
          fi
          rm siem-update-sign

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "siem-agent v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: dist/*
