name: Linux.Sys.Pslist
description: Running processes with executable path, command line and owning user.
parameters:
  - name: ProcessRegex
    description: Only return processes whose name matches this regex
    default: "."
sources:
  - name: Processes
    plugin: pslist
    detection:
      selection:
        Name|re: "{{ProcessRegex}}"
      condition: selection
    fields: [Pid, Ppid, Name, Username, Exe, CommandLine, State, RssKb, Threads]
