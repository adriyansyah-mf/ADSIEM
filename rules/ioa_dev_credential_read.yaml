title: "IOA: Project interpreter or user-folder program read a credential store"
id: rule-ioa-dev-credential-read
description: >-
  An interpreter running a project, or a program from a user-writable or hidden home folder, opened a credential store it does not own: browser passwords, cookies or key, a crypto wallet, an SSH key or cloud tokens. Reported by the agent's IOA engine in detect mode
  (ioa.chain lists each step).
logsource:
  product: ioa
  service: detection
detection:
  selection:
    event.action: ioa
    ioa.rule: ioa_dev_credential_read
  condition: selection
level: high
tags:
  - attack.credential_access
  - attack.t1555.003
