title: Browser or Wallet Credential Store Read by an Unexpected Program
id: rule-credential-store-browser-wallet
description: >-
  A program other than the browser opened its saved passwords, cookies or
  master key (Local State), or a crypto wallet's data (extension storage or
  wallet file). Infostealers and the payloads of fake job interviews read
  these first. Password managers importing from a browser can look like
  this: exclude them with an alerts exclusion.
logsource:
  product: credential
  service: access
detection:
  selection:
    event.action: credential_store_access
    credential.store:
      - browser_passwords
      - browser_cookies
      - browser_master_key
      - wallet_extension
      - wallet_file
  condition: selection
level: medium
tags:
  - attack.credential_access
  - attack.t1555.003
