title: Web Server Process Started A Shell
id: rule-webserver-spawn-shell
supersedes: Linux Web Server Spawning Interactive Shell
description: >-
  A web server or app runtime (apache2, nginx, php-fpm, tomcat/java, node)
  started a shell: the strongest single sign of a webshell or RCE, since a
  web server has no reason to run bash/sh/dash. Sourced from the agent's
  eBPF process-exec monitor. Matches the parent program (ParentImage) or,
  when the agent had none for it, the name of the process that called exec
  (Comm, decoded as OriginalFileName): a forked apache2 worker running PHP
  system() still carries the name apache2 at that point. Agents before
  1.27.7 sent no ParentImage for a web server started before the agent
  (T1505.003 / T1059.004)
logsource:
  product: linux
detection:
  webserver_parent:
    ParentImage|re: '(?i)/(?:apache2|httpd|nginx|php-fpm\d*(?:\.\d+)?|php\d*(?:\.\d+)?|tomcat\d*|java|node|gunicorn|uwsgi)$'
  webserver_caller:
    OriginalFileName|re: '(?i)^(?:apache2|httpd|nginx|php-fpm.*|php\d*(?:\.\d+)?|tomcat\d*|java|node|gunicorn|uwsgi)$'
  shell_child:
    Image|re: '(?i)/(?:bash|sh|dash|zsh|ash|ksh)$'
  condition: (webserver_parent or webserver_caller) and shell_child
level: critical
tags:
  - attack.execution
  - attack.t1059.004
  - attack.persistence
  - attack.t1505.003
  - owasp.a03
