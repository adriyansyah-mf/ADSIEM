title: MySQL Brute Force Attack
id: rule-mysql-brute-force
description: >-
  Repeated "Access denied" logins to MySQL/MariaDB from the same host in the
  general query log: password guessing against the database
  (T1110). Source: log_type mysql_general.
logsource:
  product: mysql
detection:
  selection:
    event.action: db_login_failed
  condition: selection
threshold:
  count: 5
  timewindow: 300
  group_by: source.address
suppression:
  timewindow: 3600
level: high
tags:
  - attack.credential_access
  - attack.t1110.001
