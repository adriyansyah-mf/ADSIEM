title: SSH Key or Cloud Token Read by an Unexpected Program
id: rule-credential-store-keys-tokens
description: >-
  A program other than ssh, git or the cloud CLI opened an SSH private key,
  cloud credentials (AWS, Azure, gcloud, kubeconfig, Docker), a token file
  (.git-credentials, .npmrc, .netrc, .pypirc) or a GPG private key. IDEs and
  deployment scripts do this too; on its own a lead, with an IOA chain
  (ioa_dev_credential_read) a strong signal.
logsource:
  product: credential
  service: access
detection:
  selection:
    event.action: credential_store_access
    credential.store:
      - ssh_key
      - cloud_credentials
      - token_file
      - gpg_key
  condition: selection
level: low
tags:
  - attack.credential_access
  - attack.t1552.004
  - attack.t1552.001
