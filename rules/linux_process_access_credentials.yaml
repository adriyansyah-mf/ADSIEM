title: Credential Process Memory Read On Linux
id: rule-linux-process-access-credentials
description: >-
  A program read the memory of sshd, sudo, su, login, a keyring or ssh-agent
  (process_vm_readv or /proc/<pid>/mem): credential dumping such as
  mimipenguin or a custom dumper, the Linux side of reading lsass (T1003.007).
  Treat passwords and keys held by TargetImage as stolen.
logsource:
  product: linux
  service: process_access
detection:
  read:
    access.action:
      - vm_read
      - mem_read
  target:
    TargetImage|endswith:
      - /sshd
      - /sshd-session
      - /sudo
      - /su
      - /login
      - /gnome-keyring-daemon
      - /ssh-agent
      - /gpg-agent
      - /kwalletd5
      - /kwalletd6
      - /polkitd
      - /systemd-logind
      - /gdm-session-worker
      - /lightdm
      - /vsftpd
      - /passwd
  debugger:
    Image|endswith:
      - /gdb
      - /lldb
      - /strace
      - /ltrace
      - /valgrind
      - /perf
      - /criu
  condition: read and target and not debugger
level: critical
tags:
  - attack.credential_access
  - attack.t1003.007
