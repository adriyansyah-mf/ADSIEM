title: Download Piped Into A Shell Or Interpreter
id: rule-download-execute
supersedes: Download and Execute Payload
description: >-
  Command pipes curl or wget output straight into a shell or script
  interpreter — common malware delivery technique. The interpreter must be the
  whole command after the pipe: "| sha256sum" or "| shuf" start with "sh" and
  used to match.
logsource:
  product: linux
detection:
  curl_pipe:
    process.command_line|re: '(?i)\bcurl\s+.+\|\s*(?:sudo\s+(?:-\S+\s+)*)?(?:\S*/)?(?:(?:ba|da|z|k)?sh|python[0-9.]*|perl|ruby|php)(?![\w.\-])'
  wget_pipe:
    process.command_line|re: '(?i)\bwget\b.*\s(?:-[a-z]*O\s*-|--output-document=-)(?:\s|$).*\|\s*(?:sudo\s+(?:-\S+\s+)*)?(?:\S*/)?(?:(?:ba|da|z|k)?sh|python[0-9.]*|perl|ruby|php)(?![\w.\-])'
  condition: curl_pipe or wget_pipe
level: critical
tags:
  - attack.execution
  - attack.t1059
  - attack.defense_evasion
  - attack.t1027
