title: SQL Injection In A Web Request
id: rule-sql-injection
supersedes: SQL Injection Attempt
description: >-
  HTTP request URL or referrer contains SQL injection syntax. SELECT ... FROM
  alone is ordinary English ("/search?q=select a plan from our catalog", a
  search engine referrer), so it needs SQL context: a quote or number broken
  out with AND/OR, a subquery, a stacked query, a system table, or a trailing
  comment.
logsource:
  product: webserver
detection:
  union_select_url:
    url.path|re: '(?i)(?:union[\s\+]+(?:all[\s\+]+)?select|\([\s\+]*select[\s\+]+.+[\s\+]+from\b|[''"`][\s\+]*\)*[\s\+]*(?:and|or|;|\|\|)[\s\+]*\(?[\s\+]*select\b|\b\d+[\s\+]+(?:and|or)[\s\+]+\(?[\s\+]*select\b|;[\s\+]*select[\s\+]+.+[\s\+]+from\b|select[\s\+]+.+[\s\+]+from[\s\+]+(?:information_schema|mysql\.|pg_|sysobjects|sys\.|dual\b|master\.)|select[\s\+]+.+[\s\+]+from[\s\+]+[\w.`"\[\]]+[\s\+]*(?:where\b.*)?(?:--|#|/\*)|[=&]-?\d+[\s\+]+select[\s\+]+.+[\s\+]+from\b|[''\"\d][\s\+]*\)?[\s\+]+(?:or|and)[\s\+]+([''\"]?)(\w+)\1[\s\+]*=[\s\+]*\1\2\1(?![\w])|waitfor[\s\+]+delay[\s\+]+[''\"]|\([\s\+]*select[\s\+]+(?:@@\w+|case\b)|insert[\s\+]+into|drop[\s\+]+table|exec(?:ute)?[\s\+]*\()'
  union_select_ref:
    url.referrer|re: '(?i)(?:union[\s\+]+(?:all[\s\+]+)?select|\([\s\+]*select[\s\+]+.+[\s\+]+from\b|[''"`][\s\+]*\)*[\s\+]*(?:and|or|;|\|\|)[\s\+]*\(?[\s\+]*select\b|\b\d+[\s\+]+(?:and|or)[\s\+]+\(?[\s\+]*select\b|;[\s\+]*select[\s\+]+.+[\s\+]+from\b|select[\s\+]+.+[\s\+]+from[\s\+]+(?:information_schema|mysql\.|pg_|sysobjects|sys\.|dual\b|master\.)|select[\s\+]+.+[\s\+]+from[\s\+]+[\w.`"\[\]]+[\s\+]*(?:where\b.*)?(?:--|#|/\*)|[=&]-?\d+[\s\+]+select[\s\+]+.+[\s\+]+from\b|[''\"\d][\s\+]*\)?[\s\+]+(?:or|and)[\s\+]+([''\"]?)(\w+)\1[\s\+]*=[\s\+]*\1\2\1(?![\w])|waitfor[\s\+]+delay[\s\+]+[''\"]|\([\s\+]*select[\s\+]+(?:@@\w+|case\b)|insert[\s\+]+into|drop[\s\+]+table|exec(?:ute)?[\s\+]*\()'
  error_based_url:
    url.path|contains:
      - "sleep("
      - "benchmark("
      - "extractvalue("
      - "updatexml("
      - "1=1--"
      - "'or'"
      - "' or '"
  error_based_ref:
    url.referrer|contains:
      - "sleep("
      - "benchmark("
      - "extractvalue("
      - "updatexml("
      - "1=1--"
      - "'or'"
      - "' or '"
  condition: union_select_url or union_select_ref or error_based_url or error_based_ref
suppression:
  timewindow: 300
level: high
tags:
  - attack.initial_access
  - attack.t1190
