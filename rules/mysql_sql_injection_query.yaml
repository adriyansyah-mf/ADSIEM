title: SQL Injection Reached Database Query
id: rule-mysql-sql-injection-query
description: >-
  A statement in the MySQL/MariaDB general query log carries injected SQL:
  UNION SELECT, a literal tautology after a closing quote (' OR '1'='1),
  time/error-based functions, file read/write, or a trailing comment that
  leaves a dangling quote. Unlike the web access log, this is the query the
  database actually ran, so the payload got past the application
  (T1190). Source: log_type mysql_general.
logsource:
  product: mysql
detection:
  query:
    event.action: db_query
  union_select:
    db.statement|re: '(?i)\bunion\b[\s(]+(?:all[\s(]+|distinct[\s(]+)?select\b'
  tautology:
    db.statement|re: '(?i)''\s*(?:or|and|xor|\|\||&&)\s+(?:''[^'']*''|\d+)\s*(?:=|<>|!=|<|>|like)\s*(?:''|\d)'
  time_or_error_based:
    db.statement|contains:
      - "sleep("
      - "benchmark("
      - "extractvalue("
      - "updatexml("
      - "load_file("
      - "into outfile"
      - "into dumpfile"
  dangling_comment:
    db.statement|re: '(?:--[ \t]|#)[^'']*''\s*$'
  condition: query and (union_select or tautology or time_or_error_based or dangling_comment)
suppression:
  timewindow: 300
level: critical
tags:
  - attack.initial_access
  - attack.t1190
  - owasp.a03
