title: Java Or Node App Started A Shell
id: rule-app-runtime-spawn-shell
description: >-
  A java or node process started a shell. A webshell or RCE in a Java or
  Node app (a JSP webshell on Tomcat, Log4Shell, Confluence/OGNL, a
  deserialization bug, a vulnerable npm package) looks like this, but so does
  ordinary work: npm/yarn run package scripts through sh -c, and many apps
  shell out on purpose. High, so the AI analyst triages it at the default
  ai_min_severity, but below "Web Server Started A Shell" (critical), which
  pages. Jenkins build steps are left out by their exact shape (a freestyle
  step: sh -xe /tmp/jenkins<n>.sh; a pipeline sh step: the durable-task
  wrapper over <workspace>@tmp/durable-<id>), matched from the start of the
  command line so a payload can't opt out by naming a jenkins file somewhere
  in it. Add a policy exclusion for an app that shells out by design
  (T1505.003 / T1059.004)
logsource:
  product: linux
detection:
  runtime_parent:
    ParentImage|re: '(?i)/(?:java|node|nodejs)$'
  runtime_caller:
    OriginalFileName|re: '(?i)^(?:java|node|nodejs)$'
  shell_child:
    Image|re: '(?i)/(?:bash|sh|dash|zsh|ash|ksh)$'
  filter_jenkins_freestyle:
    CommandLine|re: '^(?:\S*/)?(?:ba|da)?sh\s+-xe?\s+/tmp/jenkins\d+\.sh$'
  filter_jenkins_pipeline:
    CommandLine|re: '^(?:\S*/)?sh\s+-c\s+["'']?\(\{\s*while\s+\[\s+-d\s+''[^'']*@tmp/durable-[0-9a-f]+''\s'
  condition: (runtime_parent or runtime_caller) and shell_child and not 1 of filter_*
level: high
tags:
  - attack.execution
  - attack.t1059.004
  - attack.persistence
  - attack.t1505.003
