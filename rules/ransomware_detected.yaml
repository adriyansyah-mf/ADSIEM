title: Ransomware Activity On Endpoint
id: rule-ransomware-detected
description: A process touched a canary file, or renamed or rewrote many files in a minute and the result looks encrypted (ransomware.detection, ransomware.entropy). ransomware.response says whether the agent killed it (ransomware.killed processes) and ransomware.isolated whether it cut the host off.
logsource:
  product: ransomware
  service: activity
detection:
  selection:
    event.action: ransomware
    ransomware.confirmed: 'true'
  condition: selection
level: critical
tags:
  - attack.impact
  - attack.t1486
