title: YARA Rule Matched On Endpoint (Low)
id: rule-yara-match-low
description: A file the agent saw being created or changed in a temp, download or web directory matched a low-severity YARA rule (yara.rule names it, file.path and file.hash.sha256 identify the file).
logsource:
  product: yara
  service: match
detection:
  selection:
    event.action: yara_match
    yara.severity: low
  condition: selection
level: low
tags:
  - attack.execution
  - attack.t1204
