title: Base64 Payload Decoded Into A Shell
id: rule-base64-execution
supersedes: Base64 Encoded Command Execution
description: >-
  Base64-encoded payload decoded and run by a shell or interpreter —
  obfuscation technique. Only decoding counts: "echo user:pass | base64"
  (a Basic Auth header, a Kubernetes secret) encodes and used to match, and
  "| sha256sum" no longer reads as "| sh".
logsource:
  product: linux
detection:
  decode_pipe:
    process.command_line|re: '(?i)\bbase64\s+(?:-[a-z]*d[a-z]*|--decode)\b[^|]*\|\s*(?:sudo\s+(?:-\S+\s+)*)?(?:\S*/)?(?:(?:ba|da|z|k)?sh|python[0-9.]*|perl|ruby|php)(?:\s|$)'
  decode_eval:
    process.command_line|re: '(?i)(?:\beval\b|\b(?:ba|da|z)?sh\s+-c)\s*[''"]?\$\(.*\bbase64\s+(?:-[a-z]*d[a-z]*|--decode)\b'
  condition: decode_pipe or decode_eval
level: high
tags:
  - attack.defense_evasion
  - attack.t1027
  - attack.execution
  - attack.t1059
