title: WordPress User Enumeration Attempt
id: rule-wordpress-user-enumeration
description: Request attempts to enumerate WordPress usernames via the author parameter or the REST API users endpoint
logsource:
  product: nginx
detection:
  author_param:
    url.path|re: '(?i)[?&]author=\d+'
  rest_users:
    url.path|contains:
      - "/wp-json/wp/v2/users"
      - "/?rest_route=/wp/v2/users"
  condition: author_param or rest_users
threshold:
  count: 5
  timewindow: 60
  group_by: source.ip
suppression:
  timewindow: 1800
level: medium
tags:
  - attack.discovery
  - attack.t1589.002
