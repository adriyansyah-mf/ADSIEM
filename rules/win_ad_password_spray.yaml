title: Windows Logon Failure
id: rule-win-ad-logon-failure-base
name: win_logon_failure
description: >-
  A failed Windows logon (4625) or Kerberos pre-authentication failure
  (4771, bad password 0x18 or unknown user 0x6); the base rule for the
  password-spray correlation below, with no alert of its own.
logsource:
  product: windows
  service: security
detection:
  ntlm_failure:
    EventID: '4625'
  kerberos_failure:
    EventID: '4771'
    Status: ['0x18', '0x6']
  condition: ntlm_failure or kerberos_failure
level: low
tags:
  - attack.credential_access
---
title: Password Spraying Against Domain Accounts
id: rule-win-ad-password-spray
description: >-
  One source failed to log on as ten or more different accounts within ten
  minutes, over NTLM (4625) or Kerberos (4771). Spraying tries one common
  password across many accounts to stay under the lockout threshold, so the
  per-account brute-force rules never fire (T1110.003 Password Spraying)
correlation:
  type: value_count
  rules:
    - win_logon_failure
  group-by:
    - IpAddress
  timespan: 10m
  condition:
    field: TargetUserName
    gte: 10
level: high
tags:
  - attack.credential_access
  - attack.t1110.003
