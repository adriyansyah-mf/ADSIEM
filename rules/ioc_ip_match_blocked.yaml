title: Connection To IP IoC Blocked
id: rule-ioc-ip-match-blocked
description: The agent's firewall dropped a connection to or from an address on the IP IoC blocklist. The traffic did not get through, but the program in process.executable tried to reach a known-bad address and is worth a look.
logsource:
  product: ioc
  service: match
detection:
  selection:
    event.action: ip_ioc_match
    ioc.blocked: 'true'
  condition: selection
level: medium
tags:
  - attack.command_and_control
  - attack.t1071
