title: SIEM Agent Stopped
id: rule-siem-agent-stopped
description: >-
  The SIEM agent on this host was stopped (or uninstalled) and did not come
  back within 2 minutes. Restarts, upgrades and host shutdowns don't fire.
  Attackers stop endpoint agents before acting (T1562.001).
logsource:
  product: siem
  service: agent
detection:
  stopped:
    event.action: agent_stopped
    event.reason: service_stop
  condition: stopped
level: high
tags:
  - attack.defense_evasion
  - attack.t1562.001
