# Shared body of both HTTPS server blocks in nginx.prod.conf (included, not a
# standalone config). Mounted at /etc/nginx/adsiem-https.conf.

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;

add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

set $server_api server-api:8000;
set $dashboard_app dashboard:80;

location /api/ws/ {
    proxy_pass http://$server_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600;
}

location /api/stream/ {
    proxy_pass http://$server_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600;
    proxy_set_header Connection "";
}

location /api/assistant/chat/stream {
    proxy_pass http://$server_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600;
    proxy_set_header Connection "";
}

# The platform's public TLS certificate (not the key), so Agents → Deploy
# agent can make hosts trust a self-signed one before they download.
location = /api/agents/platform-ca.pem {
    alias /etc/nginx/certs/cert.pem;
    default_type application/x-pem-file;
}

location /api/ {
    proxy_pass http://$server_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300;
}

location /health { proxy_pass http://$server_api; }
location /metrics { proxy_pass http://$server_api; }

location / {
    proxy_pass http://$dashboard_app;
    proxy_set_header Host $host;
}
