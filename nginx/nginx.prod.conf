worker_processes auto;
events { worker_connections 2048; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;  # default 1: a slow uplink pays for every byte
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    # Docker's DNS, re-resolved every 10s. Upstream hostnames live in variables
    # because static `upstream {}` blocks resolve once at start/reload: after a
    # redeploy gives containers new IPs, they keep proxying to the old ones (502s,
    # or the dashboard's traffic landing on a server-api replica).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        set $server_api server-api:8000;

        # Let's Encrypt HTTP-01 challenges (certbot --webroot writes here)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        # answered on plain HTTP for the container healthcheck
        location = /health { proxy_pass http://$server_api; }
        location / { return 301 https://$host$request_uri; }
    }

    # HTTPS picks its certificate by SNI. The public domain serves the Let's
    # Encrypt cert so browsers trust it; anything else (the bare IP, which sends
    # no SNI, and older hostnames) falls to default_server and keeps the
    # self-signed cert that deployed agents already trust via
    # /api/agents/platform-ca.pem. Certs stay static (loaded by the root master
    # at start/reload): variable cert paths are read by the unprivileged worker
    # on every handshake and cannot open the 0600 keys. After a renewal, reload.
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        include /etc/nginx/adsiem-https.conf;
    }

    server {
        listen 443 ssl;
        server_name adsiem.my.id;

        ssl_certificate     /etc/nginx/certs/letsencrypt/live/adsiem.my.id/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/letsencrypt/live/adsiem.my.id/privkey.pem;

        include /etc/nginx/adsiem-https.conf;
    }
}
