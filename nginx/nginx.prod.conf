worker_processes auto;
events { worker_connections 2048; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    # Docker's DNS, re-resolved every 10s. Upstream hostnames live in variables
    # because static `upstream {}` blocks resolve once at start/reload: after a
    # redeploy gives containers new IPs, they keep proxying to the old ones (502s,
    # or the dashboard's traffic landing on a server-api replica).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        set $server_api server-api:8000;

        # answered on plain HTTP for the container healthcheck
        location = /health { proxy_pass http://$server_api; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

        set $server_api server-api:8000;
        set $dashboard_app dashboard:80;

        location /api/ws/ {
            proxy_pass http://$server_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600;
        }

        location /api/stream/ {
            proxy_pass http://$server_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600;
            proxy_set_header Connection "";
        }

        location /api/assistant/chat/stream {
            proxy_pass http://$server_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600;
            proxy_set_header Connection "";
        }

        location /api/ {
            proxy_pass http://$server_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300;
        }

        location /health { proxy_pass http://$server_api; }
        location /metrics { proxy_pass http://$server_api; }

        location / {
            proxy_pass http://$dashboard_app;
            proxy_set_header Host $host;
        }
    }
}
