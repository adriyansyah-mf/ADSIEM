[pytest]
# importlib mode is required so that test files with dots in their names
# (e.g. test_siem_platform.fixture.e2e.test.py) are imported without
# pytest trying to interpret the dots as package separators.
addopts = --import-mode=importlib
asyncio_mode = auto
# One loop per run, as the session-scoped event_loop override in
# tests/server-api/conftest.py gave before pytest-asyncio 1.x removed it.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
