agent:
  id: agent-demo
  name: demo-agent
  group: default
  token: ""
  buffer_size: 10000

server:
  url: http://server-api:8000
  heartbeat_interval: 30

logs:
  - path: /var/log/auth.log
    type: linux_auth
  - path: /var/log/apache2/access.log
    type: apache_access
  - path: /var/log/apache2/error.log
    type: syslog
  - path: /var/log/syslog
    type: syslog

fim:
  enabled: true
  watch_paths:
    - /etc
    - /bin
    - /sbin
    - /usr/bin
    - /usr/sbin

firewall:
  enabled: true
  backend: auto
  dry_run: false
  protected_ips: []
  state_path: /var/lib/siem-agent/firewall.json

netwatch:
  enabled: true
  snapshot_fallback: true

detect:
  enabled: true
  rules:
    - ssh_bruteforce
    - port_scan
  max_blocked: 5000
  max_blocks_per_minute: 10

buffer:
  spill_path: /var/lib/siem-agent/spill.log
