# Differential cases: each rule set runs on each input in both libyara
# (gen_expected.py) and the Go engine (differential_test.go).
#
# inputs: plain strings are Latin-1 bytes ("\x90" is byte 0x90);
# "hex:..." is raw hex; "file:name" reads fixtures/name; 'rep:[["a",2],["b",3]]'
# concatenates repeated Latin-1 pieces ("aabbb").
#
# A case may set "unsupported: <reason>" when the Go engine rejects a
# rule that libyara accepts. The test then requires a compile error.

# ─── text strings ───────────────────────────────────────────────────
- name: text-basic
  rules: |
    rule a { strings: $a = "hello" condition: $a }
    rule b { strings: $a = "absent" condition: $a }
  inputs: ["hello world hello", "nothing", "hellhello", ""]

- name: text-overlapping
  rules: |
    rule a { strings: $a = "aa" condition: #a == 3 }
    rule b { strings: $a = "aba" condition: $a }
  inputs: ["aaaa", "ababababa", "a"]

- name: text-escapes
  rules: |
    rule a { strings: $a = "tab\there" $b = "q\"uote" $c = "\x00\x01\xff" $d = "back\\slash" condition: any of them }
  inputs: ["tab\there", "q\"uote", "\x00\x01\xff", "back\\slash", "tab here"]

- name: text-nocase
  rules: |
    rule a { strings: $a = "HeLLo" nocase condition: $a }
    rule b { strings: $a = "hello" condition: $a }
  inputs: ["HELLO", "hello", "hElLo", "h3llo", "\xc0hello"]

- name: text-nocase-latin1
  rules: |
    rule a { strings: $a = "\xc0bc" nocase condition: $a }
  inputs: ["\xc0BC", "\xe0bc", "\xc0bc"]

- name: text-wide
  rules: |
    rule w { strings: $a = "abc" wide condition: $a }
    rule aw { strings: $a = "abc" ascii wide condition: #a }
  inputs: ["a\x00b\x00c\x00", "abc", "abc a\x00b\x00c\x00", "a\x00b\x00c"]

- name: text-wide-nocase
  rules: |
    rule w { strings: $a = "AbC" wide nocase condition: $a }
  inputs: ["a\x00B\x00c\x00", "A\x00B\x00C\x00", "abc"]

- name: text-fullword
  rules: |
    rule f { strings: $a = "dom" fullword condition: $a }
  inputs: ["dom", "www.dom.com", "domain", "xdom", "dom-1", "_dom_", "1dom", "dom\n"]

- name: text-fullword-wide
  rules: |
    rule f { strings: $a = "dom" fullword wide condition: $a }
  inputs: ["d\x00o\x00m\x00", "x\x00d\x00o\x00m\x00", ".\x00d\x00o\x00m\x00.\x00", "d\x00o\x00m\x00x\x00", "xd\x00o\x00m\x00"]

- name: text-xor
  rules: |
    rule x { strings: $a = "This program" xor condition: $a }
  inputs: ["This program", "Uihr!qsnfs`l", "\x15)(2a1.3&3 ,", "this program"]

- name: text-xor-range
  rules: |
    rule x { strings: $a = "abc" xor(1-3) condition: $a }
    rule y { strings: $a = "abc" xor(2) condition: $a }
  inputs: ["abc", "`cb", "cab", "bab", "\x63\x60\x61"]

- name: text-xor-wide
  rules: |
    rule x { strings: $a = "ab" xor wide condition: $a }
  inputs: ["a\x00b\x00", "\x60\x01\x63\x01", "ab"]

- name: text-base64
  rules: |
    rule b { strings: $a = "This program cannot" base64 condition: $a }
  inputs: ["VGhpcyBwcm9ncmFtIGNhbm5vd", "QVRoaXMgcHJvZ3JhbSBjYW5ub3Q=", "QUFUaGlzIHByb2dyYW0gY2Fubm90", "This program cannot"]

- name: text-base64-alignments
  rules: |
    rule b { strings: $a = "hello" base64 condition: #a > 0 }
    rule c { strings: $a = "hi!" base64 condition: $a }
  inputs: ["aGVsbG8=", "AGhlbGxv", "AABoZWxsbw==", "eGhlbGxveA==", "aGkh", "eGhpIQ==", "eHhoaSE="]

- name: text-base64wide
  rules: |
    rule b { strings: $a = "hello" base64wide condition: $a }
  inputs: ["a\x00G\x00V\x00s\x00b\x00G\x008\x00", "aGVsbG8="]

- name: text-base64-custom
  rules: |
    rule b { strings: $a = "hello" base64("!@#$%^&*(){}[]<>,.?/|ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopq") condition: $a }
  inputs: ["aGVsbG8=", "OVvOWlPp"]

- name: text-private
  rules: |
    rule p { strings: $a = "secret" private $b = "public" condition: $a and $b }
  inputs: ["secret public", "secret"]

- name: text-anonymous
  rules: |
    rule a { strings: $ = "one" $ = "two" condition: 2 of them }
  inputs: ["one two", "one"]

# ─── hex strings ────────────────────────────────────────────────────
- name: hex-plain
  rules: |
    rule h { strings: $a = { 4D 5A 90 00 } condition: $a at 0 }
  inputs: ["MZ\x90\x00rest", "xMZ\x90\x00", "MZ\x90"]

- name: hex-wildcards
  rules: |
    rule h { strings: $a = { 4D ?? 90 } condition: $a }
    rule n { strings: $a = { 4? 5A } condition: #a }
    rule m { strings: $a = { ?D 5A } condition: #a }
  inputs: ["M\x00\x90", "MZ", "\x4fZ", "]Z \x0dZ", "MX\x91"]

- name: hex-not
  rules: |
    rule h { strings: $a = { 41 ~42 43 } condition: $a }
    rule n { strings: $a = { 41 ~4? 43 } condition: $a }
    rule m { strings: $a = { 41 ~?2 43 } condition: $a }
  inputs: ["ABC", "AXC", "AbC", "A\x52C", "AFC"]

- name: hex-jumps
  rules: |
    rule j1 { strings: $a = { 61 [2] 62 } condition: $a }
    rule j2 { strings: $a = { 61 [1-3] 62 } condition: !a[1] >= 0 }
    rule j3 { strings: $a = { 61 [2-] 62 } condition: $a }
    rule j4 { strings: $a = { 61 [-] 62 } condition: $a }
    rule j5 { strings: $a = { 61 [0-2] 62 } condition: $a }
  inputs: ["axxb", "axb", "ab", "axxxxxxb", "axxxb axb", "a b b b"]

- name: hex-alternation
  rules: |
    rule a { strings: $a = { 61 ( 62 | 63 64 ) 65 } condition: $a }
    rule b { strings: $a = { 61 ( 62 | ( 63 | 64 ) ?? ) 65 } condition: #a }
  inputs: ["abe", "acde", "ace", "adxe", "acxe abe"]

- name: hex-large-jump
  rules: |
    rule a { strings: $a = { 61 62 [0-1500] 63 64 } condition: $a }
  inputs: ["abcd", "ab                                                  cd", "abxcd"]

- name: hex-errors-trailing-jump
  rules: |
    rule a { strings: $a = { 61 [2] } condition: $a }
  inputs: ["a"]

- name: hex-errors-leading-jump
  rules: |
    rule a { strings: $a = { [2] 61 } condition: $a }
  inputs: ["a"]

- name: hex-comments
  rules: |
    rule a {
      strings:
        $a = { 61 // first byte
               62 /* second */ 63 }
      condition: $a
    }
  inputs: ["abc", "ab"]

# ─── regular expressions ────────────────────────────────────────────
- name: regex-basic
  rules: |
    rule r { strings: $a = /md5: [0-9a-f]{32}/ condition: $a }
    rule s { strings: $a = /a.c/ condition: #a }
  inputs: ["md5: d41d8cd98f00b204e9800998ecf8427e", "md5: xyz", "abc a\nc a\x00c"]

- name: regex-flags
  rules: |
    rule i { strings: $a = /hello/i condition: $a }
    rule s { strings: $a = /a.c/s condition: #a }
    rule n { strings: $a = /hel+o/ nocase condition: $a }
  inputs: ["HELLO", "a\nc", "HeLLLo", "abc"]

- name: regex-greedy-lengths
  rules: |
    rule g { strings: $a = /ab+/ condition: $a }
    rule l { strings: $a = /ab+?/ condition: $a }
    rule m { strings: $a = /a.*b/ condition: $a }
  inputs: ["abbb", "aXXbYYb", "ab"]

- name: regex-classes
  rules: |
    rule d { strings: $a = /\d{3}-\d{4}/ condition: $a }
    rule w { strings: $a = /\w+@\w+\.com/ condition: $a }
    rule s { strings: $a = /foo\sbar/ condition: $a }
    rule b { strings: $a = /\bcat\b/ condition: #a }
  inputs: ["555-1234", "me@example.com", "foo bar", "foo\tbar", "cat concat cat."]

- name: regex-bytes
  rules: |
    rule x { strings: $a = /\x90{2,}\xcc/ condition: $a }
    rule y { strings: $a = /[\x80-\xff]{3}/ condition: #a }
  inputs: ["\x90\x90\x90\xcc", "\x90\xcc", "abc\xe9\xe8\xe7\xe6"]

- name: regex-alternation
  rules: |
    rule a { strings: $a = /(cmd|powershell)\.exe/ condition: $a }
  inputs: ["cmd.exe", "powershell.exe", "pwsh.exe", "CMD.EXE"]

- name: regex-wide
  rules: |
    rule w { strings: $a = /a[bc]d/ wide condition: $a }
    rule aw { strings: $a = /a[bc]d/ wide ascii condition: #a }
  inputs: ["a\x00c\x00d\x00", "acd", "acd a\x00b\x00d\x00"]

- name: regex-fullword
  rules: |
    rule f { strings: $a = /ev[a-z]l/ fullword condition: #a }
  inputs: ["eval", "xeval", "eval(", "evalx", "evil eval"]

- name: regex-empty-match
  rules: |
    rule a { strings: $a = /x*/ condition: $a }
  inputs: ["abc", "xx", ""]

- name: regex-escaped-slash
  rules: |
    rule a { strings: $a = /\/bin\/sh/ condition: $a }
  inputs: ["/bin/sh", "bin sh"]

- name: regex-scan-limit
  rules: |
    rule a { strings: $a = /a[ ]*b/ condition: $a }
    rule h { strings: $a = { 61 [0-6000] 62 } condition: $a }
  inputs: ["a  b", 'rep:[["a",1],[" ",4093],["b",1]]', 'rep:[["a",1],[" ",4094],["b",1]]', 'rep:[["a",1],[" ",4200],["b",1]]']

# ─── conditions: strings ────────────────────────────────────────────
- name: cond-count-offset-length
  rules: |
    rule c { strings: $a = "ab" condition: #a == 3 and @a[1] == 0 and @a[3] == 6 and !a[2] == 2 and @a == 0 }
    rule u { strings: $a = "ab" condition: @a[4] == 0 or not defined @a[4] }
  inputs: ["ab ab ab", "ab ab"]

- name: cond-at-in
  rules: |
    rule at3 { strings: $a = "ab" condition: $a at 3 }
    rule in1 { strings: $a = "ab" condition: $a in (0..2) }
    rule in2 { strings: $a = "ab" condition: $a in (filesize-2..filesize) }
    rule cnt { strings: $a = "ab" condition: #a in (0..4) == 2 }
  inputs: ["xx ab ab", "ab xxx ab", "abab"]

- name: cond-of
  rules: |
    rule any1 { strings: $a = "a1" $b = "b1" $c = "c1" condition: any of them }
    rule all1 { strings: $a = "a1" $b = "b1" $c = "c1" condition: all of them }
    rule none1 { strings: $a = "a1" $b = "b1" $c = "c1" condition: none of them }
    rule two { strings: $a = "a1" $b = "b1" $c = "c1" condition: 2 of ($a, $c) or $b at 100 }
    rule pct { strings: $a = "a1" $b = "b1" $c = "c1" condition: 50% of them }
    rule wild { strings: $x1 = "x1" $x2 = "x2" $y = "y1" condition: all of ($x*) and not $y }
  inputs: ["a1", "a1 b1", "a1 b1 c1", "c1 a1", "x1 x2", "x1 y1", ""]

- name: cond-of-at-in
  rules: |
    rule at0 { strings: $a = "ab" $b = "cd" condition: any of them at 0 }
    rule in5 { strings: $a = "ab" $b = "cd" condition: all of them in (0..5) }
  inputs: ["ab cd", "cd ab", "xx ab cd"]

- name: cond-for-of
  rules: |
    rule f1 { strings: $a = "ab" $b = "cd" condition: for any of them : ($ at 0) }
    rule f2 { strings: $a = "ab" $b = "cd" condition: for all of ($a, $b) : (# >= 2) }
    rule f3 { strings: $a = "ab" $b = "cd" condition: for 1 of them : (@ > 2) }
    rule f4 { strings: $a = "ab" $b = "cdx" condition: for all of them : (! >= 2) }
  inputs: ["ab cd ab cd", "cd ab", "zz ab", "ab cdx"]

- name: cond-for-in
  rules: |
    rule r1 { strings: $a = "ab" condition: for all i in (1..#a) : (@a[i] % 3 == 0) }
    rule r2 { strings: $a = "ab" condition: for any i in (1..#a) : (@a[i] == 6) }
    rule r3 { condition: for any i in (1, 2, 3) : (i == filesize) }
    rule r4 { condition: for all i in (0..filesize-1) : (uint8(i) != 0) }
    rule r5 { strings: $a = "ab" condition: for 2 i in (1..3) : (@a[i] >= 0) }
  inputs: ["ab ab ab", "abxab ab", "xx", "x\x00x", "abc"]

- name: cond-for-in-empty-runtime
  rules: |
    rule all_empty { strings: $a = "zz" condition: for all i in (1..#a) : (false) }
    rule any_empty { strings: $a = "zz" condition: for any i in (1..#a) : (true) }
    rule none_empty { strings: $a = "zz" condition: for none i in (1..#a) : (true) }
  inputs: ["ab"]

- name: cond-range-const-error
  rules: |
    rule r { condition: for all i in (1..0) : (false) }
  inputs: ["x"]

- name: cond-nested-loops
  rules: |
    rule n { strings: $a = "a" $b = "b" condition: for any i in (1..#a) : (for any j in (1..#b) : (@b[j] == @a[i] + 1)) }
  inputs: ["ab", "a b", "ba a b ab"]

# ─── conditions: integers and operators ─────────────────────────────
- name: cond-int-read
  rules: |
    rule mz { condition: uint16(0) == 0x5A4D }
    rule be { condition: uint16be(0) == 0x4D5A }
    rule u32 { condition: uint32(1) == 0x04030201 }
    rule s8 { condition: int8(0) == -1 }
    rule s16 { condition: int16(0) < 0 }
    rule s32be { condition: int32be(0) == -2 }
    rule oob { condition: uint32(filesize - 2) == 0 or not defined uint32(filesize - 2) }
  inputs: ["MZ\x90", "\x00\x01\x02\x03\x04", "\xff\xff\xff\xfe", "Z"]

- name: cond-arith
  rules: |
    rule a1 { condition: 7 \ 2 == 3 and 7 % 3 == 1 and -7 \ 2 == -3 and -7 % 3 == -1 }
    rule a2 { condition: (1 + 2) * 3 == 9 and 1 + 2 * 3 == 7 }
    rule a3 { condition: 0x0F & 0x3C == 0x0C and 0x0F | 0x30 == 0x3F and 0x0F ^ 0xFF == 0xF0 }
    rule a4 { condition: 1 << 4 == 16 and 256 >> 4 == 16 and ~0 == -1 and 1 << 64 == 0 }
    rule a5 { condition: 2.5 * 2 == 5 and 1.0 \ 4 == 0.25 and 3 > 2.5 }
    rule a6 { condition: 1KB == 1024 and 2MB == 2097152 and 0o17 == 15 }
    rule a7 { condition: filesize \ (filesize - 3) > 0 or true }
    rule a8 { condition: -filesize == 0 - filesize }
  inputs: ["abc", "abcdef"]

- name: cond-divzero-const
  rules: |
    rule d { condition: 1 \ 0 == 0 }
  inputs: ["x"]

- name: cond-divzero-runtime
  rules: |
    rule d { condition: 10 \ (filesize - 3) == 0 }
    rule e { condition: not (10 % (filesize - 3) == 0) }
    rule f { condition: (10 \ (filesize - 3) == 0) or filesize == 3 }
  inputs: ["abc", "abcd"]

- name: cond-strings-ops
  rules: |
    rule s1 { condition: "abc" contains "b" and "abc" startswith "ab" and "abc" endswith "bc" }
    rule s2 { condition: "ABC" icontains "b" and "ABC" istartswith "ab" and "ABC" iendswith "bc" and "ABC" iequals "abc" }
    rule s3 { condition: "abc" < "abd" and "b" > "abc" and "abc" == "abc" and "abc" != "ab" }
    rule s4 { condition: "hello" matches /l+o$/ and not ("hello" matches /^l/) }
  inputs: ["x"]

- name: cond-bool-compare-error
  rules: |
    rule b { condition: true == true }
  inputs: ["x"]

- name: cond-booleans
  rules: |
    rule b1 { condition: true and not false }
    rule b2 { condition: filesize }
    rule b3 { condition: "x" and 1 }
    rule b4 { condition: 0 or "" }
  inputs: ["x", ""]

- name: cond-undefined
  rules: |
    rule u1 { strings: $a = "zz" condition: not (@a[1] == 0) }
    rule u2 { strings: $a = "zz" condition: (@a[1] == 0) or true }
    rule u3 { strings: $a = "zz" condition: not ((@a[1] == 0) and true) }
    rule u4 { strings: $a = "zz" condition: not ((@a[1] == 0) or false) }
    rule u5 { strings: $a = "zz" condition: defined (@a[1] + 1) or filesize > 100 }
    rule u6 { strings: $a = "zz" condition: not not (@a[1] == 0) }
    rule u7 { strings: $a = "zz" condition: not (not (@a[1] == 0) or (@a[1] == 0)) }
  inputs: ["ab"]

# ─── rules ──────────────────────────────────────────────────────────
- name: rule-refs
  rules: |
    private rule is_mz { condition: uint16(0) == 0x5A4D }
    rule has_x { strings: $x = "x" condition: $x }
    rule both { condition: is_mz and has_x }
    rule any_rule { condition: any of (is_mz, has_x) }
    rule wild_rules { condition: all of (has_*) }
  inputs: ["MZx", "MZ", "x", ""]

- name: rule-global
  rules: |
    global rule small { condition: filesize < 10 }
    rule a { strings: $a = "a" condition: $a }
  inputs: ["a", "a long input over ten"]

- name: rule-tags-meta
  rules: |
    rule t : tag1 tag2 {
      meta:
        author = "x"
        score = 75
        neg = -1
        active = true
      strings:
        $a = "evil"
      condition:
        $a
    }
  inputs: ["evil", "good"]

- name: rule-duplicate-error
  rules: |
    rule a { condition: true }
    rule a { condition: false }
  inputs: ["x"]

- name: rule-unreferenced-string-error
  rules: |
    rule a { strings: $a = "x" $b = "y" condition: $a }
  inputs: ["x"]

- name: rule-undefined-string-error
  rules: |
    rule a { strings: $a = "x" condition: $b }
  inputs: ["x"]

- name: modifier-errors
  rules: |
    rule a { strings: $a = "x" xor nocase condition: $a }
  inputs: ["x"]

- name: modifier-errors-base64
  rules: |
    rule a { strings: $a = "xyz" base64 fullword condition: $a }
  inputs: ["x"]

- name: comments
  rules: |
    /* block
       comment */
    rule a // trailing
    {
      strings: $a = "x" // after string
      condition: /* inline */ $a
    }
  inputs: ["x", "y"]
