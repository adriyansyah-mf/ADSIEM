agent:
  id: ""
  name: ""               # set to hostname if blank at runtime
  group: default
  token: ""              # populated automatically after enrollment
  enrollment_token: ""   # set this OR use AGENT_ENROLLMENT_TOKEN env var
  buffer_size: 10000

server:
  url: http://your-siem-server:8000
  heartbeat_interval: 30

# Common log paths by distro:
#   Debian/Ubuntu (with rsyslog): /var/log/auth.log, /var/log/syslog
#   RHEL/Fedora:                  /var/log/secure, /var/log/messages
#   Kali / journald-only:         install rsyslog, or use /var/log/dpkg.log to test
logs:
  - path: /var/log/auth.log
    type: linux_auth
  - path: /var/log/syslog
    type: syslog

# AI investigations can ask to run commands on this host once an analyst
# approves them on the server (Settings → ai_command_execution). To refuse
# them on this host regardless, uncomment:
# live_response:
#   disable_commands: true

# Durable evidence (staged rollout, off by default): events are journaled on
# disk and only removed after the server confirms durable receipt. Enable only
# once the server advertises it (EVIDENCE_INGEST_ENABLED) and per the rollout
# in docs/operations/agent-evidence-recovery.md. On first start the legacy
# spill is imported into the journal (the file itself is kept).
# evidence:
#   enabled: true
#   dir: evidence            # inside agent.state_dir (/var/lib/siem-agent)
#   max_bytes: 1073741824    # 1 GiB local budget, never evicts unconfirmed events
