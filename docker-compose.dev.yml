# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  elasticsearch:
    ports:
      - "9200:9200"

  server-api:
    environment:
      LOG_LEVEL: debug
    volumes:
      - ./server-api/app:/app/app:ro
      - ./worker/worker:/app/worker:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    environment:
      LOG_LEVEL: debug
    volumes:
      - ./worker/worker:/app/worker:ro
      - ./decoders:/app/decoders:ro
      - ./rules:/app/rules:ro

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard/src:/app/src:ro
    environment:
      VITE_API_URL: ""
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1"]

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

  agent-demo:
    ports:
      - "1337:1337"
      - "2222:22"

  attacker:
    build:
      context: ./sim/attacker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ATTACK_TARGET: agent-demo
      ATTACK_WEB_PORT: "1337"
      ATTACK_SSH_PORT: "22"
      ATTACK_INTERVAL: ${ATTACK_INTERVAL:-45}
      ATTACK_JITTER: ${ATTACK_JITTER:-20}
    depends_on:
      agent-demo:
        condition: service_healthy
    networks:
      - siem-net
