# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  elasticsearch:
    ports:
      - "9200:9200"

  server-api:
    environment:
      LOG_LEVEL: debug
    volumes:
      - ./server-api/app:/app/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    environment:
      LOG_LEVEL: debug
    volumes:
      - ./worker/worker:/app/worker:ro
      - ./decoders:/app/decoders:ro
      - ./rules:/app/rules:ro

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard/src:/app/src:ro
    environment:
      VITE_API_URL: ""
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1"]

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.yml:/etc/nginx/nginx.conf:ro

  attack-sim:
    build:
      context: ./sim
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SIM_API_URL: http://server-api:8000
      SIM_AGENT_TOKEN: ${SIM_AGENT_TOKEN:-}
      SIM_AGENT_ID: ${SIM_AGENT_ID:-}
      SIM_HOSTNAME: agent-demo
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-20}
      SIM_LLM_ENABLED: ${SIM_LLM_ENABLED:-true}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-http://9router:20128/v1}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      NINEROUTER_MODEL: ${NINEROUTER_MODEL:-combo}
    depends_on:
      - server-api
    networks:
      - siem-net
