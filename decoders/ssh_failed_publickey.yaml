# sshd: a public key was offered and rejected
name: ssh_failed_publickey
log_type: linux_auth
type: regex
priority: 9
enabled: true
match: Failed publickey
pattern: 'sshd\[\d+\]: Failed publickey for (?:invalid user )?(?P<user>\S+) from (?P<src_ip>\S+) port (?P<port>\d+)'
fields:
  event.category: authentication
  event.outcome: failure
  event.action: login_failed
  user.name: user
  source.ip: src_ip
  source.port: port
  auth.method: publickey
