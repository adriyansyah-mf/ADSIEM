# Zeek dns.log (JSON)
name: zeek_dns
log_type: zeek
type: json
priority: 20
enabled: true
raw_fields: true
when:
  query: "*"
  qtype_name: "*"
fields:
  source.ip: id.orig_h
  source.port: id.orig_p
  destination.ip: id.resp_h
  destination.port: id.resp_p
  event.id: uid
  dns.question.name: query
  dns.question.type: qtype_name
  dns.response_code: rcode_name
  network.transport: proto
static_fields:
  event.kind: event
  event.category: network
  event.module: zeek
  event.dataset: zeek.dns
