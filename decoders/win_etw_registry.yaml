# Registry persistence watcher (agent/internal/winsensor): changes to Run keys,
# services, Winlogon, IFEO, AppInit, Active Setup and the like. Sysmon 12/13
# field names, so windows/registry_* rules apply. The writer is unknown (the
# agent compares the keys' contents), so there is no Image.
name: win_etw_registry
log_type: windows_etw_registry
type: kv
priority: 3
enabled: true
match: 'EventID='
fields:
  EventID: EventID
  winlog.event_id: EventID
  winlog.channel: Channel
  winlog.provider_name: Provider
  EventType: EventType
  TargetObject: TargetObject
  Details: Details
  registry.path: TargetObject
  registry.data.strings: Details
  event.type: EventType
static_fields:
  event.category: registry
  event.action: registry_change
