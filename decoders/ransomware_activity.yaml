# Ransomware detections from agent/internal/ransomguard:
#   detection=canary          a process touched a canary file (Linux eBPF / Windows ETW sensor)
#   detection=canary_changed  a canary changed, found by the periodic check (no process);
#                             confirmed=true when its new content looks encrypted
#   detection=canary_sync     OneDrive, from its install location, renamed or deleted a
#                             canary while syncing: planted again, no kill, no alert
#   detection=canary_retired  a canary changed in clear text 3 times in 24 h; not planted
#                             there for 24 h (encryption never retires one)
#   detection=extension_change / mass_modify / inplace_modify  bulk file heuristics;
#                             confirmed=true when the files the process wrote look
#                             encrypted (high entropy, format header gone)
#   detection=precursor       a process ran what ransomware runs before it encrypts
#                             (Precursor= shadow_delete, backup_delete, boot_tamper, byovd,
#                             defense_tamper, snapshot_delete, kernel_module); always
#                             confirmed. Image/PID are the initiator (the program behind the
#                             shells), PrecursorImage/PrecursorPID/CommandLine the command;
#                             InitiatorProtected=true: only the command was killed;
#                             Reverted= the boot settings put back.
# response: killed, kill_refused, kill_failed, isolated (confirmed, no process to kill),
#           trusted (a trusted sync client among a destroyed canary's writers: not killed),
#           none (report only / not confirmed).
name: ransomware_activity
log_type: ransomware_activity
type: kv
priority: 10
enabled: true
fields:
  ransomware.detection: detection
  ransomware.confirmed: confirmed
  ransomware.response: response
  ransomware.canary: Canary
  ransomware.files: Files
  ransomware.extension: Extension
  ransomware.entropy: Entropy
  ransomware.killed: Killed
  ransomware.isolated: Isolated
  ransomware.precursor: Precursor
  ransomware.command_line: CommandLine
  ransomware.precursor_image: PrecursorImage
  ransomware.precursor_pid: PrecursorPID
  ransomware.initiator_protected: InitiatorProtected
  ransomware.reverted: Reverted
  file.path: TargetFilename
  file.action: FileAction
  Image: Image
  process.executable: Image
  process.name: Comm
  process.pid: PID
  process.parent.pid: PPID
  user.id: User
static_fields:
  event.category: malware
  event.action: ransomware
