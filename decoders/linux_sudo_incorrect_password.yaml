# sudo: wrong password
name: linux_sudo_incorrect_password
log_type: linux_auth
type: regex
priority: 14
enabled: true
match: incorrect password attempt
pattern: 'sudo(?:\[\d+\])?:\s+(?P<user>\S+) : (?P<count>\d+) incorrect password attempts? ; TTY=(?P<tty>\S+) ; PWD=(?P<pwd>.*?) ; USER=(?P<target>\S+) ; COMMAND=(?P<cmd>.*)'
fields:
  event.category: authentication
  event.outcome: failure
  event.action: sudo_failed
  user.name: user
  user.target: target
  process.tty: tty
  process.working_directory: pwd
  process.command_line: cmd
  sudo.failed_attempts: count
