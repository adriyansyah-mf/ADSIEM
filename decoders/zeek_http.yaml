# Zeek http.log (JSON)
name: zeek_http
log_type: zeek
type: json
priority: 20
enabled: true
raw_fields: true
when:
  method: "*"
  uri: "*"
fields:
  source.ip: id.orig_h
  source.port: id.orig_p
  destination.ip: id.resp_h
  destination.port: id.resp_p
  event.id: uid
  url.domain: host
  url.path: uri
  http.request.method: method
  http.response.status_code: status_code
  user_agent.original: user_agent
  http.request.referrer: referrer
static_fields:
  event.kind: event
  event.category: network
  event.module: zeek
  event.dataset: zeek.http
