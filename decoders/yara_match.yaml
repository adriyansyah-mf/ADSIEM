# On-access YARA match from the agent (agent/internal/yarascan): a new or
# changed file in a risky directory matched one of the server's YARA
# rules. severity comes from the rule's meta (severity, or score 0-100).
name: yara_match
log_type: yara_match
type: kv
priority: 3
enabled: true
match: 'event=yara_match '
fields:
  yara.rule: rule
  yara.namespace: namespace
  yara.severity: severity
  yara.tags: tags
  yara.strings: strings
  yara.trigger: trigger
  yara.description: description
  file.path: file
  file.hash.sha256: sha256
  file.size: size
  # provenance: the server's rule, the revision that fired, and the case an AI draft came from
  yara.rule_id: rule_id
  yara.revision: revision
  yara.case: case
static_fields:
  event.category: malware
  event.action: yara_match
