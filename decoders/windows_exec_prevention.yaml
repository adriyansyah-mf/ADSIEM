# A process start matched one of the server's prevention rules on Windows
# (agent/internal/prevent, engine=etw): action=terminated (a block rule: the
# program started and was stopped right after, there is no driver to veto it
# before it runs), action=detected (a detect-only rule), or action=detected
# with Error set when a block rule could not terminate it (protected image,
# access denied).
name: windows_exec_prevention
log_type: windows_exec_prevention
type: kv
priority: 10
enabled: true
fields:
  prevention.action: action
  prevention.engine: engine
  prevention.error: Error
  rule.name: rule
  rule.id: rule_id
  rule.category: rule_type
  Image: Image
  ParentImage: ParentImage
  process.executable: Image
  process.parent.executable: ParentImage
  process.name: Comm
  process.pid: PID
  process.parent.pid: PPID
  file.hash.sha256: SHA256
static_fields:
  event.category: intrusion_detection
  event.action: exec_prevention
