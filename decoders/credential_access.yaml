# A credential store opened by a program that does not own it
# (agent/internal/credwatch): a browser's saved passwords, cookies or master
# key, a crypto wallet (extension or file), an SSH private key, cloud or
# registry tokens. Windows from the ETW file sensor's opens, Linux from
# fanotify marks on the stores. The owners (the browser, ssh, the cloud CLI)
# and indexers/backup tools are never reported.
name: credential_access
log_type: credential_access
type: kv
priority: 3
enabled: true
match: 'event=credential_access '
fields:
  credential.store: store
  file.path: target
  TargetFilename: target
  process.executable: image
  Image: image
  process.pid: pid
  process.parent.pid: ppid
  user.name: user
static_fields:
  event.category: credential_access
  event.action: credential_store_access
