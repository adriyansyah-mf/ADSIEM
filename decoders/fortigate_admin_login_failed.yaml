# FortiGate administrator login failure
name: fortigate_admin_login_failed
log_type: fortigate_traffic
type: kv
priority: 8
enabled: true
match: logdesc="Admin login failed"
fields:
  user.name: user
  source.ip: srcip
  event.reason: reason
  observer.hostname: devname
  network.protocol: ui
  log.level: level
static_fields:
  event.category: authentication
  event.action: login_failed
  event.outcome: failure
  event.dataset: fortigate.admin
