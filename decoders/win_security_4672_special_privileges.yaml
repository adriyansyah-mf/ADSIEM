# Security 4672: special privileges assigned to a new logon
# Input: the Windows agent's EventID=... key=value line (agent/internal/winevent).
name: win_security_4672_special_privileges
log_type: windows_security
type: kv
priority: 4
enabled: true
match: 'EventID=4672 '
fields:
  EventID: EventID
  winlog.event_id: EventID
  winlog.channel: Channel
  winlog.provider_name: Provider
  host.hostname: Computer
  winlog.record_id: RecordID
  user.name: SubjectUserName
  user.domain: SubjectDomainName
  winlog.privileges: PrivilegeList
  SubjectUserName: SubjectUserName
static_fields:
  event.category: iam
  event.action: special_privileges_assigned
