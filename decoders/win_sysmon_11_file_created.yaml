# Sysmon 11: file created
# Input: the Windows agent's EventID=... key=value line (agent/internal/winevent).
name: win_sysmon_11_file_created
log_type: windows_sysmon
type: kv
priority: 3
enabled: true
match: 'EventID=11 '
fields:
  EventID: EventID
  winlog.event_id: EventID
  winlog.channel: Channel
  winlog.provider_name: Provider
  host.hostname: Computer
  winlog.record_id: RecordID
  Image: Image
  TargetFilename: TargetFilename
  process.name: Image
  file.path: TargetFilename
  user.name: User
static_fields:
  event.category: file
  event.action: file_created
