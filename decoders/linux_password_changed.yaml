# passwd/chpasswd: an account password was changed
name: linux_password_changed
log_type: linux_auth
type: regex
priority: 15
enabled: true
match: password changed for
pattern: '(?P<prog>passwd|chpasswd)(?:\[\d+\])?: pam_unix\([^)]*\): password changed for (?P<user>\S+)'
fields:
  event.category: iam
  event.action: password_changed
  user.target: user
  process.name: prog
