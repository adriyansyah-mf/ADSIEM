# MySQL/MariaDB general query log: successful connection.
#   		    50 Connect	dvwa@localhost on dvwa using TCP/IP
name: mysql_general_connect
log_type: mysql_general
type: regex
priority: 20
enabled: true
match: Connect
pattern: '^(?:\d{6}\s+\d{1,2}:\d\d:\d\d\s+)?\s*(?P<thread>\d+)\s+Connect\s+(?P<user>[^@\s]+)@(?P<host>\S+) on (?P<db>\S*)\s*using (?P<transport>.+?)\s*$'
fields:
  event.category: database
  event.action: db_connect
  event.outcome: success
  user.name: user
  source.address: host
  db.name: db
  db.connection_id: thread
  network.transport: transport
